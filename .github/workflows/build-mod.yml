name: Build Mod APK

# 手动触发：本地测试用编译（debug 签名，产物直接可装）
# 与 release.yml 的区别：无需 Release/签名 secrets，产物从 Actions Artifacts 下载
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve version
        id: resolve_version
        run: |
          VERSION="0.$(git rev-list --count HEAD)"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "version=${VERSION}"

      # build.gradle 的 versionName 取 -P version 或 git tag，这里显式传 commit 数版本
      - name: Build ${{ inputs.build_type }} APK
        run: ./gradlew assembleNormal${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }} -P "version=${{ steps.resolve_version.outputs.VERSION }}"

      # release 包未签名：用 runner 上生成的临时密钥签名（仅供本地测试安装，
      # 与正式 Release 签名不同，不能覆盖升级正式版）
      - name: Sign release APKs with ephemeral key
        if: inputs.build_type == 'release'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT_DIR=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BT_DIR"

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/mod-test.jks" \
            -alias modtest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass modtest123 -keypass modtest123 \
            -dname "CN=Mod Test, OU=Test, O=Test, L=Test, ST=Test, C=CN"

          mkdir -p "$RUNNER_TEMP/signed"
          for APK_FILE in app/build/outputs/apk/normal/release/*.apk; do
            [ -e "$APK_FILE" ] || { echo "No APK found"; exit 1; }
            APK_NAME=$(basename "$APK_FILE")
            echo "Signing $APK_NAME"
            "$BT_DIR/zipalign" -f 4 "$APK_FILE" "$RUNNER_TEMP/aligned.apk"
            "$BT_DIR/apksigner" sign \
              --ks "$RUNNER_TEMP/mod-test.jks" \
              --ks-key-alias modtest \
              --ks-pass pass:modtest123 \
              --key-pass pass:modtest123 \
              --out "$RUNNER_TEMP/signed/$APK_NAME" \
              "$RUNNER_TEMP/aligned.apk"
          done
          rm -rf app/build/outputs/apk/normal/release
          mkdir -p app/build/outputs/apk/normal/release
          cp "$RUNNER_TEMP"/signed/*.apk app/build/outputs/apk/normal/release/

      - name: Collect APKs with checksums
        run: |
          mkdir -p mod-apk
          SRC_DIR="app/build/outputs/apk/normal/${{ inputs.build_type == 'debug' && 'debug' || 'release' }}"
          cp "$SRC_DIR"/*.apk mod-apk/
          for f in mod-apk/*.apk; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la mod-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-M-Mod-${{ inputs.build_type }}-${{ steps.resolve_version.outputs.VERSION }}-${{ github.run_number }}
          path: mod-apk/*
          retention-days: 14
